services:
  quepid-api-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.1
    container_name: es-test
    environment:
      - node.name=es-test
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.ml.enabled=true
      - xpack.license.self_generated.type=trial
      - node.roles=master,data,ml,ingest
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    volumes:
      - ./data/elasticsearch/:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: [ "CMD", "curl", "-I", "http://localhost:9200/" ]
      interval: 10s
      retries: 5
      start_period: 10s
  quepid-api-postgres:
    image: postgres:17-alpine
    ports:
      - 35432:5432
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=root
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  quepid-api-mysql:
    image: mysql:8.4.4
    platform: linux/amd64
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 10s
    environment:
      # NOTE: do NOT set MYSQL_DATABASE here. It would create an empty 'db',
      # which makes Quepid's entrypoint think the schema is already loaded,
      # skip db:setup, and then die on 'db:migrate:status' under 'bash -e'.
      # Leaving it unset lets Quepid create and seed the database itself.
      MYSQL_ROOT_PASSWORD: 'password'
    ports:
      - '3306:3306'
    expose:
      - '3306'
    volumes:
      - ./data/mysql/:/var/lib/mysql
  quepid-api-quepid:
    image: o19s/quepid:8.5.0
    # build:
    #   context: ./quepid-api-unofficial/quepid
    #   dockerfile: Dockerfile.prod
    container_name: quepid-api-quepid
    platform: linux/amd64
    ports:
      - "3000:3000"
#    command: ["/usr/bin/sleep", "infinity"]
    depends_on:
      # quepid-api-postgres:
      #   condition: service_healthy
      quepid-api-mysql:
        condition: service_healthy
      quepid-api-elasticsearch:
        condition: service_healthy
    environment:
      PORT: "3000"
      RACK_ENV: "production"
      RAILS_ENV: "production"
      MAX_THREADS: "2"
      WEB_CONCURRENCY: "2"
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      TC_URL: ""
      PRIVACY_URL: ""
      COOKIES_URL: ""
      QUEPID_GA: ""
      QUEPID_DOMAIN: "localhost:3000"
      QUEPID_PROTOCOL: "http"
      FORCE_SSL: "false"
      EMAIL_MARKETING_MODE: "false"
      QUEPID_DEFAULT_SCORER: "AP@10"
      SIGNUP_ENABLED: "true"
      COMMUNAL_SCORERS_ONLY: "false"
      EMAIL_PROVIDER: ""
      EMAIL_SENDER: ""
      QUERY_LIST_SORTABLE: "true"
      QUEPID_PROPHET_ANALYTICS: "true"
      DATABASE_URL: "mysql2://root:password@quepid-api-mysql:3306/db"
      SECRET_KEY_BASE: "<secret key base>"
  quepid-api-app:
    container_name: quepid-api-app
#    image: frutik777/quepid-api-unofficial:v0.9.5
    platform: linux/amd64
    build:
      context: ./quepid-api-unofficial/quepid_api
      dockerfile: Dockerfile
      target: app
    env_file:
      - .env
    environment:
      DEBUG: 1
    depends_on:
      quepid-api-mysql:
        condition: service_healthy
      quepid-api-elasticsearch:
        condition: service_healthy
    network_mode: service:quepid-api-web
  quepid-api-web:
    container_name: quepid-api-web
#    image: frutik777/quepid-api-unofficial-web:v0.9.5
    platform: linux/amd64
    build:
      context: ./quepid-api-unofficial/quepid_api
      dockerfile: Dockerfile
      target: web
    ports:
      - '8081:80'
  quepid-api-litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: quepid-api-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./data/litellm/config.yaml:/app/config.yaml:ro
    env_file:
      - .env-private
    environment:
      DATABASE_URL: "postgresql://root:password@quepid-api-postgres:5432/litellm"
    depends_on:
      quepid-api-postgres:
        condition: service_healthy
    ports:
      - '4000:4000'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      retries: 5
      start_period: 20s
